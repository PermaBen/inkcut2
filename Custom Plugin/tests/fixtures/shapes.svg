<?xml version="1.0" encoding="UTF-8"?>
<!-- 1 user unit = 1 mm. Expected mm bboxes are noted per element. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200mm" height="200mm" viewBox="0 0 200 200">
  <defs>
    <rect id="src" x="0" y="0" width="10" height="10" style="fill:#00ff00"/>
  </defs>
  <!-- group: rect -> (10,20)-(30,30); circle -> (40,20)-(60,40) -->
  <g id="g1" transform="translate(10,20) scale(2)">
    <rect id="r1" x="0" y="0" width="10" height="5" style="fill:none;stroke:#ff0000"/>
    <circle id="c1" cx="20" cy="5" r="5" style="fill:#0000ff"/>
  </g>
  <!-- cubic: (10,2.5)-(30,10), open -->
  <path id="cubic1" d="M 10 10 C 10 0 30 0 30 10" style="fill:none;stroke:#000000"/>
  <!-- arc semicircle: (10,30)-(50,50), open -->
  <path id="arc1" d="M 10 50 A 20 20 0 0 1 50 50" style="fill:none;stroke:#000000"/>
  <!-- full circle from two arcs: (70,40)-(90,60), closed -->
  <path id="arc2" d="M 70 50 A 10 10 0 1 0 90 50 A 10 10 0 1 0 70 50 Z"/>
  <!-- radius too small -> scaled up to 10: (0,80)-(20,90) -->
  <path id="arc3" d="M 0 90 A 1 1 0 0 1 20 90"/>
  <!-- clone of #src: scale(2) then translate(20,30) -> (40,60)-(60,80) -->
  <use id="use1" xlink:href="#src" x="20" y="30" transform="scale(2)"/>
  <!-- clone of a group (nested transforms): g1 shifted by (100,100) -> (110,120)-(160,140) -->
  <use id="use2" xlink:href="#g1" x="100" y="100"/>
  <!-- two subpaths, relative commands: (100,10)-(110,20) closed + (120,10)-(130,10) open -->
  <path id="multi" d="m 100 10 h 10 v 10 h -10 z m 20 0 h 10"/>
  <ellipse id="ell1" cx="150" cy="50" rx="20" ry="10" transform="rotate(90 150 50)"/>
  <line id="line1" x1="0" y1="100" x2="50" y2="110" style="stroke:#123456"/>
  <polyline id="pl1" points="0,120 10,130 20,120"/>
  <polygon id="pg1" points="30,120 40,130 50,120"/>
  <rect id="rr1" x="60" y="100" width="20" height="10" rx="3"/>
  <!-- hidden things must be skipped -->
  <g id="hiddengroup" style="display:none">
    <rect id="hr1" x="0" y="0" width="190" height="190"/>
  </g>
  <rect id="hr2" x="0" y="0" width="190" height="190" display="none"/>
  <g id="mixed">
    <rect id="vis1" x="5" y="150" width="10" height="10"/>
    <rect id="hid1" x="0" y="0" width="190" height="190" style="display:none"/>
    <image id="img1" x="0" y="0" width="10" height="10" xlink:href="data:image/png;base64,iVBORw0KGgo="/>
  </g>
  <g id="layer1" transform="translate(5,5)">
    <!-- selected child of a transformed layer: (5,175)-(15,185) -->
    <rect id="inlayer" x="0" y="170" width="10" height="10"/>
  </g>
</svg>
